name: Build and Publish Docker image

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet and smoke test (parse a few live blocks, no ClickHouse)
        run: |
          go vet ./...
          go run . -print-ddl > /dev/null
          timeout 120 go run . -dry-run -count 3

      - name: Compute image name and tags
        if: github.event_name != 'pull_request'
        id: meta
        shell: bash
        run: |
          REPO_LOWER="${GITHUB_REPOSITORY,,}"
          IMAGE="ghcr.io/${REPO_LOWER}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          TAGS=("sha-${GITHUB_SHA::7}")
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then TAGS+=("latest"); fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAGS+=("$GITHUB_REF_NAME"); fi
          (IFS=,; echo "tags=${TAGS[*]}") >> "$GITHUB_OUTPUT"

      - name: Build and push
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAGS:  ${{ steps.meta.outputs.tags }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          echo "$REGISTRY_PASSWORD" | docker login ghcr.io -u "$REGISTRY_USERNAME" --password-stdin
          IFS=',' read -ra TAG_LIST <<< "$TAGS"
          TAG_ARGS=()
          for tag in "${TAG_LIST[@]}"; do TAG_ARGS+=(-t "$IMAGE:$tag"); done
          docker build "${TAG_ARGS[@]}" .
          for tag in "${TAG_LIST[@]}"; do docker push "$IMAGE:$tag"; done

      - name: Trigger Coolify deployment
        if: github.event_name != 'pull_request'
        env:
          COOLIFY_DEPLOY_HOOK_URL: ${{ secrets.COOLIFY_DEPLOY_HOOK_URL }}
          COOLIFY_DEPLOY_BEARER_TOKEN: ${{ secrets.COOLIFY_DEPLOY_BEARER_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$COOLIFY_DEPLOY_HOOK_URL" ]]; then
            echo "COOLIFY_DEPLOY_HOOK_URL not set, skipping deploy."
            exit 0
          fi
          AUTH_HEADER=()
          if [[ -n "$COOLIFY_DEPLOY_BEARER_TOKEN" ]]; then
            AUTH_HEADER=(-H "Authorization: Bearer $COOLIFY_DEPLOY_BEARER_TOKEN")
          fi
          curl -fsS -X POST "${AUTH_HEADER[@]}" "$COOLIFY_DEPLOY_HOOK_URL"
